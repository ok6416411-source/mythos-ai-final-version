name: Backend deploy

# Bringt Datenbank-Migrationen und Edge Functions automatisch ins eigene Supabase-Projekt
# (statt Lovable Cloud, das bei leeren Credits pausiert). Läuft bei jeder Änderung unter supabase/
# auf "neu". Zweimal pro Woche ein kurzer Ping, damit das Gratis-Projekt nie einschläft.
# Ohne die Secrets SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF / SUPABASE_DB_PASSWORD passiert nichts.

on:
  push:
    branches: [neu]
    paths:
      - 'supabase/**'
      - 'scripts/backend-move/project.sh'
      - '.github/workflows/backend-deploy.yml'
  schedule:
    - cron: '23 6 * * 1,4'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Eingerichtet?
        id: cfg
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$REF" ] && [ -n "$DB_PASSWORD" ]; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "Eigenes Supabase noch nicht eingerichtet (Secrets fehlen) – nichts zu tun."; echo "on=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.on == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.on == 'true'
        with:
          version: latest

      - name: Projekt-Zugang holen
        if: steps.cfg.outputs.on == 'true'
        run: bash scripts/backend-move/project.sh

      - name: Wach halten
        if: steps.cfg.outputs.on == 'true' && github.event_name == 'schedule'
        run: |
          curl -sS "$NEW_URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $NEW_ANON" -o /dev/null -w "Ping %{http_code}\n" || true

      - name: Migrationen anwenden
        if: steps.cfg.outputs.on == 'true' && github.event_name != 'schedule'
        run: supabase db push --db-url "$NEW_DB_URL" --include-all

      - name: Edge Functions bereitstellen
        if: steps.cfg.outputs.on == 'true' && github.event_name != 'schedule'
        run: supabase functions deploy --project-ref "$REF" --no-verify-jwt --use-api
